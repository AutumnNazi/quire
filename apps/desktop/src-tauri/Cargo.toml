[package]
name = "quire"
version = "0.1.0"
description = "Local-first read-later. Clippings are plain Markdown on your own disk."
authors = ["chenkaiyuan"]
license = "MIT"
edition = "2021"
rust-version = "1.82"

[lib]
# Tauri 2 桌面端的标准三件套:动态库给移动端,静态库给 Windows/macOS 桌面
name = "quire_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
chrono = { version = "0.4", features = ["serde"] }
thiserror = "2"
# 只为拿系统文档目录,几十 KB,不值当自己拼路径(Windows 上 Documents 会被 OneDrive 重定向)
dirs = "6"

# 读剪贴板的 CF_HTML 格式。版本与 Tauri 传递依赖的那个对齐,免得同一份代码编两遍。
[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.60", features = [
    "Win32_Foundation",
    "Win32_System_DataExchange",
    "Win32_System_Memory",
    # CF_UNICODETEXT 常量在这里,尽管它跟 OLE 八竿子打不着
    "Win32_System_Ole",
] }

[dev-dependencies]
tempfile = "3"

[profile.release]
# Tauri 产物体积主要在这个二进制上,lto + 单 codegen unit 换构建时间
lto = true
codegen-units = 1
opt-level = "s"
strip = true
