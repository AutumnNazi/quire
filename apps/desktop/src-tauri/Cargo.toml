[package]
name = "quire"
version = "0.1.0"
description = "Local-first read-later. Clippings are plain Markdown on your own disk."
authors = ["chenkaiyuan"]
license = "MIT"
edition = "2021"
rust-version = "1.82"

[lib]
# Tauri 2 桌面端的标准三件套:动态库给移动端,静态库给 Windows/macOS 桌面
name = "quire_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
chrono = { version = "0.4", features = ["serde"] }
thiserror = "2"
# 只为拿系统文档目录,几十 KB,不值当自己拼路径(Windows 上 Documents 会被 OneDrive 重定向)
dirs = "6"
# 下载文章里的图片存到本地。reqwest 的默认 TLS 已经是 rustls(纯 Rust),
# 不拉 OpenSSL,Windows / macOS / Linux 都不用装系统包。
# 图片本地化跑在自己的后台线程里,用阻塞客户端最省事,不必把整个下载
# 流程摊平成 async。blocking 会带进 tokio 的同步部分,只在这一个点上用。
reqwest = { version = "0.13", default-features = false, features = [
    "blocking",
    "rustls",
    "http2",
    "charset",
] }

# 读剪贴板的 CF_HTML 格式。版本与 Tauri 传递依赖的那个对齐,免得同一份代码编两遍。
[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.60", features = [
    "Win32_Foundation",
    "Win32_System_DataExchange",
    "Win32_System_Memory",
    # CF_UNICODETEXT 常量在这里,尽管它跟 OLE 八竿子打不着
    "Win32_System_Ole",
] }

# macOS 从 NSPasteboard 读剪贴板。objc2-app-kit 提供 AppKit 绑定
# (NSPasteboard 就在这儿),objc2-foundation 提供 NSString 这些基础类型。
# 版本跟着 Tauri 传递依赖里那几个走,免得同一份 objc2 编两遍。
[target.'cfg(target_os = "macos")'.dependencies]
objc2-app-kit = { version = "0.3", features = ["NSPasteboard"] }
objc2-foundation = { version = "0.3", features = ["NSString", "NSArray", "NSObject"] }

[dev-dependencies]
tempfile = "3"

[profile.release]
# Tauri 产物体积主要在这个二进制上,lto + 单 codegen unit 换构建时间
lto = true
codegen-units = 1
opt-level = "s"
strip = true
